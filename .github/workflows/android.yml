name: Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.6.0"

      - name: Restore pinned debug signing key
        shell: bash
        run: |
          mkdir -p "$HOME/.android"
          base64 --decode ci/debug.keystore.b64 > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"

      - name: Download pinned GRIB2Tools
        shell: bash
        run: |
          mkdir -p app/libs
          curl --fail --location --retry 3 \
            "https://raw.githubusercontent.com/philippphb/GRIB2Tools/479142eaf75e00a57ae4a10e0fd31e51bf5c9542/lib/GRIB2Tools.jar" \
            --output app/libs/GRIB2Tools.jar

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: YulCaribe-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
