name: Apply Android settings patch

on:
  push:
    branches: [ main ]
    paths:
      - .github/workflows/app-settings-patch.yml
      - tools/app_patch.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Patch Android source
        run: python3 tools/app_patch.py

      - name: Commit patch and remove one-shot helpers
        shell: bash
        run: |
          rm -f .github/workflows/app-settings-patch.yml tools/app_patch.py
          rmdir tools 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Persist main airport and align map UX with Main"
          git push origin HEAD:main
